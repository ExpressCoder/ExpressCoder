<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Lot Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 Parking Lot Management System</h1>
            <p class="subtitle">Multilevel Smart Parking</p>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <h3>Total Available Spots</h3>
                <p class="stat-value" id="totalAvailable">650</p>
            </div>
            <div class="stat-card">
                <h3>Bike Spots Available</h3>
                <p class="stat-value" id="bikeAvailable">400</p>
            </div>
            <div class="stat-card">
                <h3>Car Spots Available</h3>
                <p class="stat-value" id="carAvailable">250</p>
            </div>
        </div>

        <div class="visualization-container">
            <h2>Parking Visualization</h2>
            <div class="parking-lot-visual">
                <div class="parking-building">
                    <div class="floor floor-7" data-floor="7">
                        <div class="floor-label">F7</div>
                        <div class="parking-spots"></div>
                    </div>
                    <div class="floor floor-6" data-floor="6">
                        <div class="floor-label">F6</div>
                        <div class="parking-spots"></div>
                    </div>
                    <div class="floor floor-5" data-floor="5">
                        <div class="floor-label">F5</div>
                        <div class="parking-spots"></div>
                    </div>
                    <div class="floor floor-4" data-floor="4">
                        <div class="floor-label">F4</div>
                        <div class="parking-spots"></div>
                    </div>
                    <div class="floor floor-3" data-floor="3">
                        <div class="floor-label">F3</div>
                        <div class="parking-spots"></div>
                    </div>
                    <div class="floor floor-2" data-floor="2">
                        <div class="floor-label">F2</div>
                        <div class="parking-spots"></div>
                    </div>
                    <div class="floor floor-1" data-floor="1">
                        <div class="floor-label">F1</div>
                        <div class="parking-spots"></div>
                    </div>
                </div>
                <div class="road">
                    <div class="car" id="animatedCar">
                        <div class="car-body"></div>
                        <div class="car-wheels"></div>
                    </div>
                </div>
            </div>
            <div class="animation-status" id="animationStatus"></div>
        </div>

        <div class="main-content">
            <div class="form-section">
                <h2>Park Your Vehicle</h2>
                <form id="parkingForm">
                    <div class="form-group">
                        <label for="vehicleType">Vehicle Type</label>
                        <select id="vehicleType" required>
                            <option value="">Select Type</option>
                            <option value="BIKE">Bike</option>
                            <option value="CAR">Car</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="registrationNo">Registration Number</label>
                        <input type="text" id="registrationNo" placeholder="e.g., KA-01-AB-1234" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Park Vehicle</button>
                </form>

                <div class="exit-section">
                    <h2>Exit Parking</h2>
                    <form id="exitForm">
                        <div class="form-group">
                            <label for="exitRegistrationNo">Registration Number</label>
                            <input type="text" id="exitRegistrationNo" placeholder="Enter registration number" required>
                        </div>
                        <button type="submit" class="btn btn-danger">Exit Parking</button>
                    </form>
                </div>
            </div>

            <div class="floors-section">
                <h2>Floor Capacity</h2>
                <div class="floors-grid" id="floorsGrid">
                    <!-- Floors will be populated by JavaScript -->
                </div>
            </div>
        </div>

        <div class="vehicles-section">
            <h2>Parked Vehicles</h2>
            <button class="btn btn-secondary" onclick="refreshVehicles()">Refresh List</button>
            <div class="vehicles-table">
                <table id="vehiclesTable">
                    <thead>
                        <tr>
                            <th>Registration No</th>
                            <th>Type</th>
                            <th>Floor</th>
                            <th>Entry Time</th>
                        </tr>
                    </thead>
                    <tbody id="vehiclesTableBody">
                        <!-- Vehicles will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="message-container">
            <div id="message" class="message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
