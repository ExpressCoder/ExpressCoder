spring.application.name=ParkingLotSystemDesign
server.port=8081

# MySQL datasource (defaults for local docker-compose)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parking?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:parking_user}
spring.datasource.password=${DB_PASSWORD:parking_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Expose Prometheus metrics endpoint
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=ParkingLotSystemDesign

