spring.application.name=ParkingLotSystemDesign
server.port=8081

# MySQL datasource (set environment vars or edit these values)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parking?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
